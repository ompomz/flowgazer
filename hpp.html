<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hex pubkey picker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            padding: 16px;
            line-height: 1.3;
            font-weight: normal;
            background-color: #f7f7f7;
            color: #333;
        }

        h1 {
            font-size: 1.25rem;
            color: #555;
            margin-bottom: 0rem;
        }

        h2 {
            font-size: 1rem;
            color: #555;
            margin: 6px 0px 6px 0px;
        }

        p {
            font-size: .9rem;
            color: #666;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        section {
            max-width: 600px;
            margin-right: auto;
            padding: 0rem;
        }

        @media (max-width: 767px) {
            section {
                max-width: 100%;
                padding: 0px;
                margin: 0;
            }
        }

        input[type="text"],
        textarea {
            width: calc(100% - 100px);
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            transition: border-color .2s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #4c51bf;
        }

        textarea#pubkey-textarea {
            resize: vertical;
        }

        button {
            padding: 4px 12px;
            background-color: #4c51bf;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color .2s;
            white-space: nowrap;
        }

        button:hover {
            background-color: #667eea;
        }

        button[onclick="getFollowList()"],
        button[onclick="getProfiles()"] {
            background-color: #ffb366;
        }

        button[onclick="getFollowList()"]:hover,
        button[onclick="getProfiles()"]:hover {
            background-color: #ffa347;
        }

        button[onclick="checkAll(true)"],
        button[onclick="checkAll(false)"] {
            background-color: #66b3ff;
        }

        button[onclick="checkAll(true)"]:hover,
        button[onclick="checkAll(false)"]:hover {
            background-color: #4da6ff;
        }

        button[onclick="extractSelected()"] {
            background-color: #ff99cc;
        }

        button[onclick="extractSelected()"]:hover {
            background-color: #ff66b2;
        }

        button[onclick="copyExtractedFollows()"],
        button[onclick="copyHexes()"] {
            background-color: #ffd700;
        }

        button[onclick="copyExtractedFollows()"]:hover,
        button[onclick="copyHexes()"]:hover {
            background-color: #ffc400;
        }

        button[onclick="pasteFromExtractedFollows()"],
        button[onclick="clearPubkeyTextarea()"] {
            background-color: #f7f7f7;
            color: #ff99cc;
            padding: 0;
            margin: 0px 0px 7px 0px;
        }

        button[onclick="pasteFromExtractedFollows()"]:hover,
        button[onclick="clearPubkeyTextarea()"]:hover {
            background-color: #f7f7f7;
            color: #ff66b2;
            padding: 0;
            margin: 0px 0px 7px 0px;
        }

        /* テーブル内の列コピーボタン用デザイン */
        th button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            padding: 0;
            margin-left: 4px;
            color: #777;
            background: transparent;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        th button:hover {
            color: #222;
            background: hsl(0, 0%, 93%);
        }

        th button svg {
            width: 12.5px;
            height: 12.5px;
        }

        hr {
            max-width: 600px;
            border: none;
            border-top: 1px dashed #ccc;
            margin: 8px 0px 4px 0px;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: flex-start;
            padding: 4px 0px 4px 0px;
        }

        .kind0-group {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            justify-content: flex-start;
            padding: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            margin: 4px 0px 4px 0px;
            table-layout: fixed;
        }

        th,
        td {
            padding: 5px;
            border: 1px solid #e2e8f0;
            font-weight: normal;
            word-break: break-all;
        }

        /* 列幅の指定（チェックボックスは40px、残りの4列を均等割り） */
        #profile-table th:nth-child(1),
        #profile-table td:nth-child(1) {
            width: 40px;
            text-align: center;
        }

        #profile-table th:nth-child(2),
        #profile-table td:nth-child(2) {
            width: 24%;
        }

        #profile-table th:nth-child(3),
        #profile-table td:nth-child(3) {
            width: 24%;
        }

        #profile-table th:nth-child(4),
        #profile-table td:nth-child(4) {
            width: 26%;
        }

        #profile-table th:nth-child(5),
        #profile-table td:nth-child(5) {
            width: 26%;
        }
    </style>

<body>
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
        <symbol id="copy-icon" viewBox="0 0 24 24">
            <rect x="9" y="9" width="13" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
    </svg>

    <div id="header-placeholder"></div>
    <h1>hex pubkey picker</h1>

    <!-- リレー設定セクション -->
    <section>
        <h2>リレー設定</h2>
        <div class="input-group">
            <input type="text" id="relay-input" value="wss://nos.lol/" placeholder="wss://...">
            <button onclick="changeRelay()">適用</button>
        </div>
    </section>
    <hr>

    <!-- フォローリストセクション -->
    <section>
        <h2>kind:3（フォローリスト）</h2>
        <div class="input-group">
            <input type="text" id="follow-input" placeholder="公開鍵（hex / npub1 / NIP-05）">
            <button onclick="getFollowList()">取得</button>
        </div>
        <div class="input-group">
            <textarea id="extracted-follows" rows="3" cols="40" placeholder="フォロイーの公開鍵一覧"></textarea>
            <button onclick="copyExtractedFollows()">コピー</button>
        </div>
    </section>
    <hr>

    <!-- プロフィール取得セクション -->
    <section>
        <div class="kind0-group">
            <h2>kind:0（プロフィール取得）</h2>
            <button onclick="pasteFromExtractedFollows()">上から貼付</button>
            <button onclick="clearPubkeyTextarea()">クリア</button>
        </div>
        <div class="input-group">
            <textarea id="pubkey-textarea" rows="3" cols="40" placeholder="公開鍵（hex1...,hex2...,...）"></textarea>
            <button onclick="getProfiles()">取得</button>
        </div>
        <hr>
        <div class="input-group">
            <button onclick="checkAll(true)">全部チェック</button>
            <button onclick="checkAll(false)">全部はずす</button>
            <button onclick="extractSelected()">抽出</button>
        </div>
        <div class="input-group">
            <textarea id="extracted-hexes" rows="1" cols="40" placeholder="抽出後の公開鍵一覧"></textarea>
            <button onclick="copyHexes()">コピー</button>
        </div>

        <!-- 拡張されたテーブル -->
        <table border="1" id="profile-table">
            <thead>
                <tr>
                    <th> </th>
                    <th>
                        name
                        <button onclick="copyColumn(1)" title="コピー">
                            <svg>
                                <use href="#copy-icon"></use>
                            </svg>
                        </button>
                    </th>

                    <th>
                        display_name
                        <button onclick="copyColumn(2)" title="コピー">
                            <svg>
                                <use href="#copy-icon"></use>
                            </svg>
                        </button>
                    </th>

                    <th>
                        hex
                        <button onclick="copyColumn(3)" title="コピー">
                            <svg>
                                <use href="#copy-icon"></use>
                            </svg>
                        </button>
                    </th>

                    <th>
                        npub
                        <button onclick="copyColumn(4)" title="コピー">
                            <svg>
                                <use href="#copy-icon"></use>
                            </svg>
                        </button>
                    </th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/nostr-tools@2.1.2/lib/nostr.bundle.min.js"></script>
    <script>
        const { bech32 } = window.NostrTools.nip19;
        let relayURL = "wss://nos.lol/";

        // 入力順とプロフィールデータを保持するグローバル変数
        let profiles = {};
        let orderMap = {};

        function changeRelay() {
            const inputVal = document.getElementById("relay-input").value.trim();
            if (!inputVal.startsWith("wss://") && !inputVal.startsWith("ws://")) {
                return alert("有効なWebSocketリレーURL（wss://...）を入力してください");
            }
            relayURL = inputVal;
            console.log(`[Relay] リレーURLを変更しました: ${relayURL}`);
            alert(`リレーを ${relayURL} に変更しました`);
        }

        async function resolveNip05(nip05) {
            const parts = nip05.split('@');
            if (parts.length !== 2) return null;

            const [name, domain] = parts;
            try {
                const response = await fetch(`https://${domain}/.well-known/nostr.json?name=${name}`);
                const data = await response.json();
                return data.names[name] || null;
            } catch (e) {
                console.error(`NIP-05アドレスの解決に失敗しました: ${nip05}`, e);
                return null;
            }
        }

        function bech32Decode(npub) {
            try {
                const { data } = NostrTools.nip19.decode(npub);
                return data;
            } catch {
                return null;
            }
        }

        async function normalizePubkeys(input) {
            const keys = input.split(/[\s,]+/).filter(Boolean);
            const resolvedKeys = await Promise.all(keys.map(async k => {
                if (k.startsWith("npub1")) {
                    return bech32Decode(k);
                } else if (/^[a-f0-9]{64}$/i.test(k)) {
                    return k;
                } else if (k.includes('@')) {
                    return await resolveNip05(k);
                } else {
                    return null;
                }
            }));
            return resolvedKeys.filter(Boolean);
        }

        async function getFollowList() {
            const input = document.getElementById("follow-input").value.trim();
            const pubkey = (await normalizePubkeys(input))[0];
            if (!pubkey) return alert("無効な公開鍵です");

            console.log(`[Relay] 接続試行中 (${relayURL}) - フォローリスト取得`);
            const socket = new WebSocket(relayURL);

            socket.onopen = () => {
                console.log(`[Relay] 接続成功: ${relayURL}`);
                const req = ["REQ", "follow-req", { kinds: [3], authors: [pubkey], limit: 1 }];
                socket.send(JSON.stringify(req));
            };

            socket.onmessage = (event) => {
                const [type, , eventData] = JSON.parse(event.data);
                if (type === "EVENT") {
                    console.log("[Relay] イベント受信完了（フォローリスト）");
                    const follows = eventData.tags
                        .filter(tag => tag[0] === "p")
                        .map(tag => tag[1]);
                    document.getElementById("extracted-follows").value = follows.join(",");
                    socket.close();
                }
            };

            socket.onerror = (error) => {
                console.error(`[Relay] エラー発生 (${relayURL}):`, error);
            };

            socket.onclose = () => {
                console.log(`[Relay] 接続が閉じられました (${relayURL})`);
            };
        }

        function copyExtractedFollows() {
            const textarea = document.getElementById("extracted-follows");
            textarea.select();
            document.execCommand("copy");
            alert("コピーしました！");
        }

        function pasteFromExtractedFollows() {
            const sourceTextarea = document.getElementById("extracted-follows");
            const targetTextarea = document.getElementById("pubkey-textarea");
            targetTextarea.value = sourceTextarea.value;
        }

        async function getProfiles() {
            const input = document.getElementById("pubkey-textarea").value;
            const pubkeys = await normalizePubkeys(input);
            if (pubkeys.length === 0) return alert("有効な公開鍵がありません");

            // 状態を初期化
            profiles = {};
            orderMap = {};

            // 入力順を記録
            pubkeys.forEach((key, index) => {
                orderMap[key] = index;
            });

            // 全件分の空データを先に作成
            pubkeys.forEach(hex => {
                let npub = "";
                try {
                    npub = NostrTools.nip19.npubEncode(hex);
                } catch {
                    npub = "";
                }
                profiles[hex] = {
                    name: "",
                    displayName: "",
                    hex: hex,
                    npub: npub
                };
            });

            renderTable(); // まず空行の状態で描画

            console.log(`[Relay] 接続試行中 (${relayURL}) - プロフィール取得 (${pubkeys.length}件)`);
            const socket = new WebSocket(relayURL);

            socket.onopen = () => {
                console.log(`[Relay] 接続成功: ${relayURL}`);
                const req = ["REQ", "profile-req", { kinds: [0], authors: pubkeys }];
                socket.send(JSON.stringify(req));
            };

            socket.onmessage = (event) => {
                const [type, , eventData] = JSON.parse(event.data);
                if (type === "EVENT") {
                    try {
                        const profile = JSON.parse(eventData.content);
                        const hex = eventData.pubkey;

                        if (profiles[hex]) {
                            profiles[hex].name = profile.name || "";
                            profiles[hex].displayName = profile.display_name || "";
                        }

                        renderTable(); // データが届くたびにテーブルを更新
                    } catch {
                        console.warn("プロフィール解析失敗", eventData);
                    }
                } else if (type === "EOSE") {
                    console.log("[Relay] EOSE（データ受信終了）を受信しました");
                }
            };

            socket.onerror = (error) => {
                console.error(`[Relay] エラー発生 (${relayURL}):`, error);
            };

            socket.onclose = () => {
                console.log(`[Relay] 接続が閉じられました (${relayURL})`);
            };
        }

        // テーブルの描画処理（入力順を維持・XSS対策のtextContentを使用）
        function renderTable() {
            const tbody = document.querySelector("#profile-table tbody");

            // 現在チェックされているhexを保持しておく
            const checkedHexes = Array.from(tbody.querySelectorAll("input[type='checkbox']:checked"))
                .map(cb => cb.value);

            tbody.innerHTML = '';

            Object.values(profiles)
                .sort((a, b) => orderMap[a.hex] - orderMap[b.hex])
                .forEach(profile => {
                    const row = document.createElement("tr");

                    // 1列目: チェックボックス
                    const tdCheck = document.createElement("td");
                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.value = profile.hex;
                    if (checkedHexes.includes(profile.hex)) {
                        checkbox.checked = true;
                    }
                    tdCheck.appendChild(checkbox);
                    row.appendChild(tdCheck);

                    // 2列目: name
                    const tdName = document.createElement("td");
                    tdName.textContent = profile.name;
                    row.appendChild(tdName);

                    // 3列目: display_name
                    const tdDisplayName = document.createElement("td");
                    tdDisplayName.textContent = profile.displayName;
                    row.appendChild(tdDisplayName);

                    // 4列目: hex
                    const tdHex = document.createElement("td");
                    tdHex.textContent = profile.hex;
                    row.appendChild(tdHex);

                    // 5列目: npub
                    const tdNpub = document.createElement("td");
                    tdNpub.textContent = profile.npub;
                    row.appendChild(tdNpub);

                    tbody.appendChild(row);
                });
        }

        // 指定した列のデータを改行区切りでコピー
        function copyColumn(index) {
            const rows = document.querySelectorAll("#profile-table tbody tr");
            if (rows.length === 0) return alert("コピーするデータがありません");

            const values = Array.from(rows)
                .map(row => row.cells[index]?.textContent || "")
                .join("\n");

            navigator.clipboard.writeText(values)
                .then(() => alert("列のデータをコピーしました！"))
                .catch(() => alert("コピーに失敗しました"));
        }

        function clearPubkeyTextarea() {
            document.getElementById("pubkey-textarea").value = '';
        }

        function checkAll(flag) {
            document.querySelectorAll("#profile-table tbody input[type='checkbox']").forEach(cb => cb.checked = flag);
        }

        function extractSelected() {
            const selected = Array.from(document.querySelectorAll("#profile-table tbody input[type='checkbox']:checked"))
                .map(cb => cb.value);
            document.getElementById("extracted-hexes").value = selected.join(",");
        }

        function copyHexes() {
            const textarea = document.getElementById("extracted-hexes");
            textarea.select();
            document.execCommand("copy");
            alert("コピーしました！");
        }
    </script>
</body>

</html>
