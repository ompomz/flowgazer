<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flowgazer</title>
    <link rel="icon" type="image/x-icon" href="https://ompomz.github.io/flowgazer/favicon.ico">

    <style>
        /* ベーススタイル */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-weight: 400;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
            padding: .5rem;
            line-height: 1.3;
            background-color: #f7f7f7;
            color: #666;
            font-size: .9rem;
        }

        .container {
            max-width: 600px;
            margin: 0 auto 0 .5rem;
            padding: .5rem;
        }

        a {
            color: #666;
            text-decoration: none;
        }

        h1 {
            font-size: 1.1rem;
        }

        /* フォーム要素の共通設定 */
        input,
        textarea,
        select {
            box-sizing: border-box;
            vertical-align: middle;
            text-align: start;
            min-height: 28.5px;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
            background-color: #fff;
            font-family: inherit;
            font-size: .9rem;
            color: #666;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: .5rem;
            margin: 0;
            flex-grow: 1;
        }

        input[type="checkbox"] {
            vertical-align: middle;
            cursor: pointer;
        }

        textarea {
            resize: none;
        }

        /* ボタン共通 */
        .container button {
            background-color: #ddd;
            font-size: .8rem;
            font-weight: 700;
            text-align: center;
            color: #fff;
            white-space: nowrap;
            padding: 0.25rem 0.75rem;
            margin: 0;
            min-width: 4rem;
            min-height: 1.75rem;
            border: none;
            border-radius: 999px;
            cursor: pointer;
        }

        .full-width {
            width: 100%;
        }

        /* レイアウト用共通クラス */
        .flex-container {
            display: flex;
            align-items: center;
            row-gap: 0.5rem;
            column-gap: 0.25rem;
            margin: 0;
        }

        .flex-column {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .flex-wrap {
            flex-wrap: wrap;
        }

        /* チェックボックス行専用のスタイル */
        .settings-checkbox-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.25rem;
            margin: 0;
        }

        .settings-checkbox-row input {
            flex-grow: 0 !important;
            width: auto;
            margin: 0;
        }

        .settings-checkbox-row label {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            white-space: nowrap;
            margin-left: 0.5rem;
            font-size: 0.85rem;
        }

        .settings-checkbox-row .no-margin-left {
            margin-left: 0 !important;
        }

        #kind-7-content-input {
            width: 2.2rem;
            height: 1.5rem;
            text-align: center;
            padding: 0;
        }

        /* ehagaki モーダル関連 */
        /* ボタン: open-ehagaki-modal */
        #open-ehagaki-modal {
            position: fixed;
            top: 0.5rem;
            right: 0.5rem;
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 50%;
            background-color: hsla(150, 70%, 70%, 0.3);
            background-image: url('https://raw.githubusercontent.com/Lokuyow/ehagaki/main/public/ehagaki_icon.svg');
            background-size: 60%;
            background-repeat: no-repeat;
            background-position: center;
            border: none;
            cursor: pointer;
            z-index: 999;
            transition: transform 0.2s;
        }

        #open-ehagaki-modal:hover {
            transform: scale(1.1);
        }

        /* モーダル外枠 */
        #ehagaki-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        /* モーダルコンテンツ */
        #ehagaki-modal>div {
            position: relative;
            width: 95%;
            max-width: 600px;
            height: 80vh;
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }

        /* 閉じるボタン */
        #close-ehagaki-modal {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            font-weight: bold;
            color: #fff;
            background: hsl(152, 74%, 43%, 0.5);
            border: none;
            border-radius: 999px;
            padding: 6px 18px;
            cursor: pointer;
        }

        /* iframe */
        #ehagaki-iframe {
            width: 100%;
            height: 100%;
        }

        /* タイムライン・表示制御 */
        ul {
            list-style: none;
            padding: 0;
            margin: .5rem 0;
        }

        li.event {
            word-break: break-all;
            padding: .5rem .25rem;
            border-top: 1px dashed #ddd;
        }

        .event-liked {
            border-right: .3rem solid gold;
        }

        .npub-link,
        .nostr-ref,
        .pubkey-ref {
            color: #66b3ff;
            text-decoration: none;
        }

        .custom-emoji {
            height: 1.2rem;
            vertical-align: bottom;
        }

        .post-content {
            display: inline;
        }

        .hidden-section,
        .hidden {
            display: none;
        }

        #tab-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            align-items: center;
        }

        .tab-button.active {
            background: #66b3ff;
        }

        #load-more {
            background: #66b3ff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        #send-new-post,
        #subscribe-relay,
        #apply-filter,
        #clear-filter {
            background-color: #ffcc66;
        }

        /* アニメーション */
        #load-more.loading::before {
            content: "";
            width: 0.9rem;
            height: 0.9rem;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='3' stroke-linecap='round'><path d='M12 2a10 10 0 1 1-10 10' /></svg>");
            background-size: contain;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* フッター・レスポンシブ */
        .viewongithub {
            margin-top: 0.5rem;
            text-align: center;
            padding-bottom: 3rem;
        }

        .viewongithub a {
            color: #66b3ff !important;
        }

        @media (max-width: 768px) {
            .container {
                max-width: 100%;
                padding: 0.5rem 0.5rem 0.5rem 0.25rem;
                margin: 0;
            }
        }

        @media (max-width: 400px) {
            .container button {
                font-size: 0.7rem !important;
            }
        }

        /* コンテナ：指の座標（中心）を基準にする */
        .lp-menu {
            position: fixed;
            z-index: 10000;
            width: 0;
            height: 0;
            pointer-events: none;
            /* 計算の根拠： 1. likeボタンの配置が top: -3rem 2. 指との隙間を 1rem あけたい ⇒ コンテナの中心（指の位置）を基準に、 likeボタンの「上端」が指の「+1rem」の位置に来るように調整します。 */
            transform: translate(-1.5rem, 5rem);
            animation: menu-pop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes menu-pop {
            from {
                opacity: 0;
                /* translate の値を合わせつつ、スケールを小さく */
                transform: translate(-1.5rem, 5rem) scale(0.5);
            }

            to {
                opacity: 1;
                /* ここを新しい数値に合わせる */
                transform: translate(-1.5rem, 5rem) scale(1);
            }
        }

        /* 共通スタイル：中心から移動させるために absolute にする */
        .lp-item {
            position: absolute;
            width: 3rem;
            height: 3rem;
            background: #ffffff;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border: none;
            transition: all 0.2s ease;
            user-select: none;
            pointer-events: auto;
        }

        /* SVGアイコンのサイズと色を自動調整 */
        .lp-item svg {
            width: 1.5rem;
            height: 1.5rem;
            display: block;
            transition: transform 0.2s ease;
        }

        /* ふぁぼボタンだけはテキスト（絵文字）なので専用調整 */
        #lp-like-icon {
            font-family: "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
            font-size: 1.25rem;
            line-height: 1;
        }

        /* 位置の個別設定 (中心からの距離) */
        /* 上：like */
        .lp-item[data-action="like"] {
            top: -3rem;
            left: 0;
            color: #ffcc66;
        }

        /* 左：repost */
        .lp-item[data-action="repost"] {
            top: 0;
            left: -3rem;
            color: #66b3ff;
        }

        /* 右：quote */
        .lp-item[data-action="quote"] {
            top: 0;
            left: 3rem;
            color: #666666;
        }

        /* 下：reply */
        .lp-item[data-action="reply"] {
            top: 3rem;
            left: 0;
            color: #66b3ff;
        }

        /* 選択時のエフェクト */
        .lp-item.selected {
            background: #fff;
            transform: scale(1.06);
            box-shadow:
                0 0 20px 12px rgba(120, 170, 255, 0.35),
                0 0 40px 20px rgba(120, 170, 255, 0.25),
        }
    </style>
</head>

<body>
    <button id="open-ehagaki-modal"></button>

    <div id="ehagaki-modal" style="display:none;">
        <div>
            <button id="close-ehagaki-modal">✕ とじる</button>
            <iframe id="ehagaki-iframe"
                src="https://lokuyow.github.io/ehagaki/?parentOrigin=https://ompomz.github.io/flowgazer/kit-ten.html"
                allow="local-network-access; local-network; loopback-network" frameborder="0" width="600" height="400">
            </iframe>
        </div>
    </div>
    <div id="long-press-menu" class="lp-menu" style="display: none;">
        <div class="lp-item" data-action="like" id="lp-like-icon" title="ふぁぼ"></div>

        <div class="lp-item" data-action="repost" title="RT">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"

                <polyline points="17 1 21 5 17 9"></polyline>
                <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>

        <div class="lp-item" data-action="quote" title="引用">

            </svg>

    <div id="push-menu" class="container"
        style="height: 16rem; padding-bottom: 0; margin-top: -13.5rem; background-color: #f7f7f7; transition: margin-top 0.4s ease; display: flex; flex-direction: column; justify-content: flex-end;">

                    <option value="wss://relay-jp.nostr.wirednet.jp/">

    <!-- 既存JS -->
    <script src="https://ompomz.github.io/tweetsrecap/utility.js"></script>
    <script src="./auth.js"></script>
    <script src="./auth-ui.js"></script>
    <script src="https://unpkg.com/nostr-tools@2.17.0/lib/nostr.bundle.js"></script>

    <!-- 新設計JS -->
    <script src="./event-bus.js"></script>
    <script src="./relay-manager.js"></script>
    <script src="./data-store.js"></script>
    <script src="./view-state.js"></script>
    <script src="./profile-fetcher.js"></script>
    <script src="./timeline.js"></script>
    <script src="./app.js"></script>

    <script>
        console.log('✅ スクリプト読み込み完了');

        // --- eHagaki 管理マネージャー ---
        window.ehagakiManager = {
            ORIGIN: 'https://lokuyow.github.io',
            NS: 'ehagaki.embed',
            VERSION: 1,

            get modal() { return document.getElementById('ehagaki-modal'); },
            get iframe() { return document.getElementById('ehagaki-iframe'); },

            /**
             * 一意な requestId を生成する。
             * crypto.randomUUID が使える環境ではそれを優先し、
             * 使えない環境（非セキュアコンテキスト等）では時刻+乱数でフォールバックする。
             * どちらの場合も空文字にはならない。
             * @param {string} prefix
             * @returns {string}
             */
            _generateRequestId(prefix) {
                if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
                    return `${prefix}-${crypto.randomUUID()}`;
                }
                return `${prefix}-${Date.now()}-${Math.random().toString(36).substring(2, 9)}`;
            },

            open(payload = null) {
                const parentUrl = window.location.origin + window.location.pathname;
                const url = new URL(`${this.ORIGIN}/ehagaki/`);

                url.searchParams.set('parentOrigin', parentUrl);

                if (payload) {
                    if (payload.reply) url.searchParams.set('reply', payload.reply);
                    if (payload.quotes) {
                        payload.quotes.forEach(q => url.searchParams.append('quote', q));
                    }
                    if (payload.content) url.searchParams.set('content', payload.content);

                    // チャンネル（パブリックチャット）起動時パラメータ
                    if (payload.channel) {
                        const ch = payload.channel;
                        if (ch.reference) url.searchParams.set('channel', ch.reference);
                        if (ch.relays?.length) url.searchParams.set('channelRelays', ch.relays.join(','));
                        if (ch.name) url.searchParams.set('channelName', ch.name);
                        if (ch.about) url.searchParams.set('channelAbout', ch.about);
                        if (ch.picture) url.searchParams.set('channelPicture', ch.picture);
                    }
                }

                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                url.searchParams.set('embedTheme', prefersDark ? 'dark' : 'light');

                this.iframe.src = url.toString();
                this.modal.style.display = 'flex';
            },

            close() {
                this.modal.style.display = 'none';
            },

            post(type, data = {}) {
                if (!this.iframe.contentWindow) return;

                const message = {
                    namespace: this.NS,
                    version: this.VERSION,
                    type: type,
                    ...data
                };
                this.iframe.contentWindow.postMessage(message, this.ORIGIN);
            },

            setContext(payload) {
                this.post('composer.setContext', {
                    requestId: this._generateRequestId('mgr'),
                    payload: {
                        reply: payload.reply || null,
                        quotes: payload.quotes || [],
                        content: payload.content ?? ""
                    }
                });
            },

            /**
             * hex の channelId を nevent1... にエンコードする。
             *
             * eHagaki側は channel.reference / URLクエリ channel= に
             * note1... または nevent1... のみを受け付け、生のhexは
             * バリデーションでreject（またはURLクエリとして無視）される。
             * そのため flowgazer 内部で保持している hex channelId は、
             * eHagakiへ渡す直前に必ずここでエンコードする。
             *
             * 投稿先リレーの取りこぼしを防ぐため、現在接続中のリレー
             * （window.relayManager.url）を relay hint として埋め込む。
             *
             * @param {string} channelId - 生のhex event id
             * @returns {string|null} nevent1... 文字列。エンコード失敗時は null
             */
            _encodeChannelReference(channelId) {
                const connectedRelay = window.relayManager?.url || null;
                try {
                    return window.NostrTools.nip19.neventEncode({
                        id: channelId,
                        relays: connectedRelay ? [connectedRelay] : []
                    });
                } catch (e) {
                    console.error('❌ channelId の nevent エンコードに失敗:', e);
                    return null;
                }
            },

            /**
             * タイムラインのチャンネルバッジクリック用エントリポイント。
             * - モーダル未表示: URLクエリ付きで新規起動（初回描画のチラつき防止のため name/about/picture も渡す）
             * - モーダル表示中: 再読み込みせず composer.setContext で切り替える
             *
             * @param {string} channelId - 生のhex event id（eタグの値）
             * @param {string|null} relayHint - eタグ3番目の要素
             */
            openChannelContext(channelId, relayHint = null) {
                if (!channelId) return;

                // hex channelId は eHagaki に渡せないため nevent1... へ変換する
                const reference = this._encodeChannelReference(channelId);
                if (!reference) return;

                const meta = window.channelMetaMap?.get(channelId) || {};
                const name = window.channelNameMap?.get(channelId) || meta.name || null;

                // channelRelays（一時write relay候補）。
                // reference の nevent 内relayとあわせてドキュメント仕様の合計最大3件枠に収まるよう、
                // eタグ由来の relayHint と接続中リレーの重複を除いて先頭3件までに制限する
                const connectedRelay = window.relayManager?.url || null;
                const candidateRelays = [];
                if (relayHint) candidateRelays.push(relayHint);
                if (connectedRelay && connectedRelay !== relayHint) candidateRelays.push(connectedRelay);
                const relays = candidateRelays.slice(0, 3);

                const channel = {
                    reference,
                    relays,
                    name: name || null,
                    about: meta.about || null,
                    picture: meta.picture || null
                };

                const isOpen = this.modal.style.display === 'flex';

                if (isOpen) {
                    this.post('composer.setContext', {
                        requestId: this._generateRequestId('channel-switch'),
                        payload: { reply: null, quotes: [], channel }
                    });
                } else {
                    this.open({ channel });
                }
            },

            /**
             * パブリックチャットモードを解除し、通常の投稿状態に戻す。
             * モーダルが開いていない場合は何もしない（reload不要のため）。
             */
            closeChannelContext() {
                if (this.modal.style.display !== 'flex') return;

                this.post('composer.setContext', {
                    requestId: this._generateRequestId('channel-close'),
                    payload: { reply: null, quotes: [], channel: null }
                });
            }
        };

        // =========================
        // 🆕 storage委譲ハンドラ
        // =========================
        const STORAGE_PREFIX = 'ehagaki.embed.storage.v1:';

        const ALLOWED_KEYS = new Set([
            'locale',
            'themeMode',
            'darkMode',
            'uploadEndpoint',
            'clientTagEnabled',
            'quoteNotificationEnabled',
            'imageCompressionLevel',
            'videoCompressionLevel',
            'mediaFreePlacement',
            'showMascot',
            'showFlavorText',
            'settingsPreferenceMetadata',
            'firstVisit',
            'sharedMediaProcessed',
        ]);

        function handleStorage(data) {
            const mgr = window.ehagakiManager;

            const respond = (msg) => {
                mgr.iframe.contentWindow.postMessage({
                    namespace: mgr.NS,
                    version: mgr.VERSION,
                    requestId: data.requestId,
                    ...msg
                }, mgr.ORIGIN);
            };

            // GET
            if (data.type === 'storage.get') {
                const values = {};

                for (const key of data.payload.keys) {
                    if (!ALLOWED_KEYS.has(key)) continue;
                    values[key] = localStorage.getItem(STORAGE_PREFIX + key);
                }

                respond({
                    type: 'storage.result',
                    payload: { timestamp: Date.now(), values }
                });
            }

            // SET
            if (data.type === 'storage.set') {
                const applied = [];

                for (const [key, value] of Object.entries(data.payload.values)) {
                    if (!ALLOWED_KEYS.has(key)) continue;
                    if (typeof value !== 'string') continue;

                    localStorage.setItem(STORAGE_PREFIX + key, value);
                    applied.push(key);
                }

                respond({
                    type: 'storage.result',
                    payload: { timestamp: Date.now(), applied }
                });
            }

            // REMOVE
            if (data.type === 'storage.remove') {
                const removed = [];

                for (const key of data.payload.keys) {
                    if (!ALLOWED_KEYS.has(key)) continue;

                    localStorage.removeItem(STORAGE_PREFIX + key);
                    removed.push(key);
                }

                respond({
                    type: 'storage.result',
                    payload: { timestamp: Date.now(), removed }
                });
            }
        }

        // ========================================
        // 🗄️ IndexedDB 委譲 (idb.*) のハンドラ
        // ========================================
        function handleIdb(data) {
            const mgr = window.ehagakiManager;
            if (!data.requestId) return;

            const replyToIframe = (type, payload) => {
                mgr.iframe.contentWindow.postMessage({
                    namespace: mgr.NS,
                    version: 1,
                    type: type,
                    requestId: data.requestId,
                    payload: payload
                }, mgr.ORIGIN);
            };

            // uploadDestinations などのストアからのデータ取得要求に対するフォールバック応答
            // 親側でIDBを持たない場合でも、空の配列やオブジェクトを返してタイムアウトを防ぐ
            if (data.type === 'idb.getAll' || data.type === 'idb.get') {
                // 必要であれば localStorage から復元しても良いが、
                // まずはタイムアウト回避のため空の結果（または初期値）を返す
                replyToIframe('idb.result', { timestamp: Date.now(), result: [] });
                return;
            }

            if (data.type === 'idb.set' || data.type === 'idb.delete' || data.type === 'idb.clear') {
                replyToIframe('idb.result', { timestamp: Date.now(), success: true });
                return;
            }
        }

        // --- メイン初期化処理 ---
        document.addEventListener('DOMContentLoaded', async () => {
            if (!window.dataStore || !window.viewState) {
                console.error('❌ 初期化エラー');
                return;
            }

            window.timeline = new Timeline(document.getElementById('timeline'));
            await window.app.init();

            const openBtn = document.getElementById('open-ehagaki-modal');
            const closeBtn = document.getElementById('close-ehagaki-modal');

            if (openBtn) openBtn.onclick = () => window.ehagakiManager.open();
            if (closeBtn) closeBtn.onclick = () => window.ehagakiManager.close();

            window.ehagakiManager.modal.onclick = (e) => {
                if (e.target === window.ehagakiManager.modal) window.ehagakiManager.close();
            };
        });

        // --- メッセージ受信ハンドラ ---
        window.addEventListener('message', async (event) => {
            const mgr = window.ehagakiManager;
            const auth = window.nostrAuth;

            if (event.origin !== mgr.ORIGIN) return;
            if (event.source !== mgr.iframe.contentWindow) return;

            const data = event.data;
            if (data?.namespace !== mgr.NS) return;

            // 🆕 ここでstorageを先に処理（重要）
            if (data.type?.startsWith('storage.')) {
                handleStorage(data);
                return;
            }

            // 🆕 idb.* の処理を追加
            if (data.type?.startsWith('idb.')) {
                handleIdb(data);
                return;
            }

            switch (data.type) {
                case 'ready':
                    if (auth.pubkey) {
                        mgr.post('auth.login', { payload: { pubkeyHex: auth.pubkey } });
                    }
                    break;

                case 'auth.request':
                    if (auth.pubkey) {
                        mgr.post('auth.result', {
                            requestId: data.requestId,
                            payload: {
                                pubkeyHex: auth.pubkey,
                                capabilities: ['signEvent']
                            }
                        });
                    }
                    break;

                case 'rpc.request':
                    if (data.payload?.method === 'signEvent') {
                        try {
                            const signed = await auth.signEvent(data.payload.params.event);
                            mgr.post('rpc.result', {
                                requestId: data.requestId,
                                payload: { result: signed }
                            });
                        } catch (err) {
                            mgr.post('rpc.error', {
                                requestId: data.requestId,
                                payload: { message: err.message }
                            });
                        }
                    }
                    break;

                case 'post.success':
                    console.log('投稿成功:', data.payload);
                    // 🆕 投稿成功したら自動でモーダルを閉じる
                    window.ehagakiManager.close();
                    break;

                // 🆕 composer.setContext の適用成功通知
                case 'composer.contextApplied':
                    if (data.requestId?.startsWith('channel-switch-')) {
                        console.log('✅ チャンネル切り替え成功:', data.requestId, data.payload);
                    } else if (data.requestId?.startsWith('channel-close-')) {
                        console.log('✅ チャンネル解除成功:', data.requestId, data.payload);
                    } else {
                        console.log('✅ composer context 反映完了:', data.requestId, data.payload);
                    }
                    break;

                // 🆕 composer.setContext の適用失敗通知
                case 'composer.contextError':
                    if (data.requestId?.startsWith('channel-switch-') || data.requestId?.startsWith('channel-close-')) {
                        console.error('❌ チャンネル切り替え失敗:', data.payload);
                    } else {
                        console.error('❌ composer context 反映失敗:', data.requestId, data.payload);
                    }
                    break;

                // 🆕 iframe内でユーザーが手動でcomposer contextを変更した場合の通知
                case 'composer.contextUpdated':
                    console.log('🔄 iframe側でコンテキスト変更:', data.payload);
                    // 必要に応じて親側のUIや状態（activeChannelId等）と同期する余地あり
                    break;
            }
        });

        // キーボードショートカット
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const modal = window.ehagakiManager?.modal;
                // display が 'none' でなければ（flexやblock等でも）閉じる
                if (modal && modal.style.display && modal.style.display !== 'none') {
                    window.ehagakiManager.close();
                }
            }
        });
    </script>
</body>

</html>
