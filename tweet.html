<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://ompomz.github.io/favicon.ico">
    <title>tweetviewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", sans-serif;
            line-height: 1.5;
            background-color: #f7f7f7;
            color: #666;
            font-size: 0.9rem;
            padding: 0.5rem;
        }

        .container {
            max-width: 600px;
            margin: 0;
            padding: 0.5rem;
            border-radius: 4px;
        }

        .container h1 {
            font-size: 1.3rem;
        }

        .container h2 {
            font-size: 1.1rem;
        }

        .container h3 {
            font-size: 1rem;
        }

        .container p {
            word-break: break-all;
        }

        .container a {
            color: #66b3ff;
            text-decoration: none;
        }

        .container a:hover {
            color: #4da6ff;
            text-decoration: underline;
        }

        @media (max-width: 767px) {
            .container {
                max-width: 100%;
            }
        }

        .container button {
            border: none;
            font-size: 0.8rem;
            padding: 0.5rem 0.8rem;
            border-radius: 999px;
            font-weight: bold;
            cursor: pointer;
            background-color: #ffb366;
            color: #fff;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container button:hover {
            background-color: #ffa347;
        }

        .header-section {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0;
            border-bottom: 1px dashed #ddd;
        }

        #main-event {
            padding: 0.5rem 0;
        }

        #status {
            margin: 0rem 0rem 1rem 0rem;
            font-weight: bold;
            color: #ff99cc;
        }

        /* --- リアクション --- */
        .reactions-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0.25rem 0rem 0.5rem 0rem;
        }

        .reactions-list img {
            height: 1.25rem !important;
            object-fit: cover;
        }

        .reaction-group {
            display: flex;
            align-items: center;
            background-color: #eee;
            border-radius: 999px;
            padding: 0.2rem 0.5rem;
            font-size: 0.8rem;
        }

        .reaction-avatars {
            display: flex;
            flex-direction: row-reverse;
        }

        .reaction-avatar {
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0;
        }

        .reaction-container {
            background: #fff5f8;
            border: 1px dashed #ffb3c1;
            border-radius: 12px;
            padding: 0.75rem;
            margin-bottom: 1rem;
        }

        .reaction-headline {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .reaction-headline-emoji {
            font-size: 1.6rem;
        }

        .reaction-headline-emoji img.custom-emoji {
            height: 1.6rem;
        }

        /* --- リポスト --- */
        .repost-banner {
            background: #f4f7ff;
            border: 1px dashed #b3c6ff;
            border-radius: 12px;
            padding: 0.75rem;
            margin-bottom: 0.75rem;
        }

        /* --- 関連投稿カード --- */
        .related-posts {
            margin: 0.5rem 0rem;
        }

        .related-post-card {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 0.25rem 0.5rem;
            margin: 0.25rem 0 0 0;
            display: block;
        }

        a.quote-link {
            display: block;
            color: inherit;
            text-decoration: none;
        }

        a.quote-link:hover {
            text-decoration: none;
        }

        a.quote-link .related-post-card:hover {
            border-color: #66b3ff;
        }

        .post-link-label {
            font-size: 0.75rem;
        }

        .related-post-card .profile,
        .related-post-card .profile-name,
        .related-post-card .profile-npub {
            font-size: 0.8rem;
        }

        .related-post-card .profile-image {
            width: 1.5rem;
            height: 1.5rem;
        }

        .related-post-card .post-content {
            font-size: 0.8rem;
            margin: 0.5rem 0rem 0.75rem 0rem;
        }

        /* --- プロフィール --- */
        .profile {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .profile-image {
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            object-fit: cover;
            background: #eee;
        }

        .profile-name {
            font-weight: bold;
            font-size: 1rem;
            color: #444;
            min-width: 0;
            max-width: 100%;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .profile-nip05,
        .profile-npub {
            text-decoration: none !important;
            font-size: 0.8rem;
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
            display: block;
        }

        .profile-picture {
            width: 6rem;
            height: 6rem;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(0, 121, 107, 0.5);
            background: #eee;
        }

        @media (max-width: 370px) {
            .profile-picture {
                width: 4.5rem;
                height: 4.5rem;
            }
        }

        .profile-card {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 1rem;
            background-color: #fff;
            border-radius: 8px;
            border: 1px solid #ddd;
            min-width: 0;
            max-width: 100%;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            min-width: 0;
        }

        .profile-info-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            min-width: 0;
        }

        .npub-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            word-break: break-all;
            padding: 0.25rem 0rem 0rem 0rem;
        }

        .copy-icon {
            cursor: pointer;
            transition: opacity 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .copy-icon svg {
            width: 1rem;
            height: 1rem;
            display: block;
        }

        .copy-icon:hover {
            opacity: 0.4;
        }

        .about-text {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #333;
            word-break: break-all;
        }

        .about-text a {
            color: #66b3ff;
            text-decoration: underline;
        }

        .about-text a:hover {
            color: #4da6ff;
        }

        .about-text .custom-emoji {
            height: 1.2rem;
            vertical-align: middle;
        }

        .post-info {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: #999;
        }

        .post-content {
            margin: 0.5rem 0rem;
            line-height: 1.5;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .post-content img {
            max-width: 15rem;
            max-height: 15rem;
            height: auto;
            display: block;
            margin: 0;
        }

        .post-content video {
            max-width: 15rem;
            max-height: 15rem;
            display: block;
            margin: 0;
        }

        .post-content img.custom-emoji {
            vertical-align: middle;
            display: inline-block;
            height: 1.2rem;
            max-width: none;
            max-height: none;
        }

        .post-content ul,
        .post-content ol {
            list-style-position: inside;
        }

        /* --- チャンネル(kind 40/41) --- */
        .channel-card {
            background: #fff;
            border: 2px solid #7c6fe0;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.5rem;
        }

        .channel-card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .channel-picture {
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 8px;
            object-fit: cover;
            background: #eee;
        }

        .channel-picture-placeholder {
            display: grid;
            place-items: center;
            font-size: 1.4rem;
        }

        .channel-name {
            margin: 0;
            font-size: 1.2rem;
            color: #444;
        }

        .channel-kind-label {
            font-size: 0.75rem;
            color: #999;
        }

        .channel-about {
            white-space: pre-wrap;
            color: #555;
            line-height: 1.6;
            margin-bottom: 0.75rem;
        }

        .channel-load-btn {
            background-color: #7c6fe0 !important;
            width: 100%;
        }

        .channel-load-btn:hover {
            background-color: #6a5dd0 !important;
        }

        .channel-context-banner {
            display: block;
            font-size: 0.8rem;
            color: #7c6fe0 !important;
            background: #f5f3ff;
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            margin-bottom: 0.5rem;
        }

        .channel-context-name {
            font-weight: bold;
        }

        /* --- チャンネルチャット --- */
        .chat-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-top: 0.5rem;
        }

        .chat-row {
            display: flex;
            gap: 0.5rem;
            align-items: flex-start;
        }

        .chat-avatar {
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            object-fit: cover;
            background: #eee;
            flex-shrink: 0;
        }

        .chat-body {
            flex: 1;
            min-width: 0;
        }

        .chat-meta {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 0.15rem;
        }

        .chat-name {
            font-weight: bold;
            color: #444 !important;
        }

        .chat-time {
            color: #999 !important;
        }

        .chat-bubble {
            background: #f1f1f1;
            padding: 0.5rem 0.75rem;
            border-radius: 0 12px 12px 12px;
            display: inline-block;
            max-width: 100%;
            word-break: break-word;
        }

        .chat-bubble img,
        .chat-bubble video {
            max-width: 12rem;
            max-height: 12rem;
        }

        /* --- 汎用イベント --- */
        .generic-event-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1rem;
        }

        .generic-event-json {
            background: #eee;
            padding: 0.5rem;
            overflow-x: auto;
            font-size: 0.75rem;
            margin-top: 0.5rem;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* --- フォーム --- */
        .nostr-form {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 0.5rem;
            padding-top: 0.25rem;
        }

        .form-input {
            color: #666;
            flex: 1;
            min-width: 0;
            width: 100%;
            max-width: 400px;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        .form-button {
            flex-shrink: 0;
            padding: 0.5rem 1.2rem !important;
        }

        .footer-section {
            padding: 0.5rem 0;
            border-top: 1px dashed #ddd;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 0.5rem;
        }

        .hidden {
            display: none !important;
        }

        .relay-status {
            font-size: 0.7rem;
            color: #bbb;
            padding: 0.25rem 0;
        }

        /* --- モーダル(画像拡大)：utility.js が自動注入するのでベースのみ --- */
        .custom-emoji-hover:hover {
            transform: scale(2.0);
            z-index: 10;
        }

        .post-image {
            max-height: 400px;
            object-fit: cover;
        }

        /* --- ログイン状態 --- */
        .auth-status-badge {
            font-size: 0.75rem;
            color: #999;
            margin-left: auto;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: none;
        }

        .auth-trigger-btn {
            background-color: #00796b !important;
            display: none;
        }

        .auth-trigger-btn:hover {
            background-color: #00655c !important;
            display: none;
        }

        /* --- 長押しアクション時のヒント --- */
        .long-pressable {
            cursor: default;
            transition: background-color 0.15s ease;
        }

        .long-pressable:active {
            background-color: rgba(124, 111, 224, 0.08);
        }

        /* --- プロフィールページの投稿一覧 --- */
        .profile-posts-section {
            margin: 0 0.5rem 0 0.5rem;
        }

        .profile-posts-status {
            color: #999;
            font-size: 0.85rem;
            padding: 0.5rem 0;
            display: none;
        }

        /* 🆕 プロフィール投稿一覧：Timelineクラスが生成する .event を
        従来の profile-post-line 相当の見た目に整形する */
        #profile-posts-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #profile-posts-list .event {
            padding: 0.6rem 0;
            border-bottom: 1px dashed #ddd;
            font-size: 0.9rem;
            line-height: 1.5;
            word-break: break-word;
        }

        #profile-posts-list .event:last-child {
            border-bottom: none;
        }

        #profile-posts-list .event .post-content {
            display: inline;
            margin: 0;
        }

        .reply-indicator,
        .npub-link {
            color: #66b3ff;
        }

        .event-liked {
            border-right: 4px solid #ffeb3b;
        }

        .profile-post-time {
            color: #66b3ff;
            text-decoration: none;
            white-space: nowrap;
        }

        .profile-post-time:hover {
            color: #4da6ff;
            text-decoration: underline;
        }

        .profile-post-content img,
        .profile-post-content video {
            max-width: 12rem;
            max-height: 12rem;
            display: block;
            margin-top: 0.3rem;
        }

        .profile-post-content img.custom-emoji {
            vertical-align: middle;
            display: inline-block;
            height: 1.2rem;
            max-width: none;
            max-height: none;
        }

        #profile-posts-load-more {
            background: #66b3ff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-top: 0.5rem;
            color: #fff;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0rem 0.8rem;
            min-height: 1.75rem;
            border-radius: 999px;
            cursor: pointer;
        }

        #profile-posts-load-more.loading::before {
            content: "";
            width: 0.9rem;
            height: 0.9rem;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='3' stroke-linecap='round'><path d='M12 2a10 10 0 1 1-10 10' /></svg>");
            background-size: contain;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="header-placeholder"></div>
    <div class="container">
        <div class="header-section">
            <button onclick="goBack()">もどる</button>
            <button onclick="copyUrl()">シェア</button>
            <button id="copy-nevent-btn" onclick="copyCurrentId()" style="display: none;">コピー</button>
            <span id="auth-status-badge" class="auth-status-badge hidden"></span>
            <button id="auth-trigger-btn" class="auth-trigger-btn hidden" onclick="showAuthUI()">🔑</button>
        </div>
        <div id="main-event"></div>
        <p id="status" class="hidden"></p>

        <div id="reactions-section" style="display: none;">
            <div id="reactions-list" class="reactions-list"></div>
        </div>

        <div id="related-events-section" style="display: none;">
            <div id="related-events-list" class="related-posts"></div>
        </div>

        <p class="relay-status hidden" id="relay-status-text"></p>

        <div class="footer-section">
            <button onclick="goBack()">もどる</button>
            <button id="jump-to-okkake" style="display: none;">このときにジャンプ</button>
        </div>
    </div>

    <script src="https://unpkg.com/nostr-tools@2.17.0/lib/nostr.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="./utility.js"></script>
    <!-- 書き込みアクション用: 本体(flowgazer)と同じ auth.js / auth-ui.js / event-bus.js / ehagaki-manager.js を
         同一フォルダ(flowgazer/)から読み込む。ログイン状態(localStorageのnostr_auth)は本体と共有される。 -->
    <script src="./event-bus.js"></script>
    <script src="./auth.js"></script>
    <script src="./auth-ui.js"></script>
    <script src="./ehagaki-manager.js"></script>
    <script src="./action-menu.js"></script>
    <script src="./data-store.js"></script>
    <script src="./timeline.js"></script>
    <script src="./tweet.js"></script>
    <script src="https://ompomz.github.io/header/loadHeader.js"></script>
</body>

</html>
