<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kensaku</title>
    <style>
        :root {
            --bg: #f7f7f7;
            --txt: #666;
            --panel: #fafafa;
            --accent: #ffcc66;
            --link: #66b3ff;
            --border: #ddd;
        }

        body.dark-mode {
            --bg: #132639;
            --txt: #ccc;
            --panel: #1b263b;
            --accent: #f0ad4e;
            --link: #4da3ff;
            --border: #444;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-weight: 400;
            padding: 0.5rem;
            line-height: 1.3;
            background-color: var(--bg);
            color: var(--txt);
            font-size: 0.9rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .container {
            max-width: 600px;
            margin: 0.5rem;
            padding-bottom: calc(env(safe-area-inset-bottom) + 4rem);
        }

        input,
        select,
        textarea {
            font-size: 0.9rem;
            padding: 0.3rem 0.5rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--txt);
            background-color: var(--panel);
            margin: 2px 0;
        }

        button {
            line-height: 1;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 2rem;
            padding: 4px 12px;
            border: none;
            border-radius: 999px;
            background-color: var(--accent);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            margin: 0.25rem 0rem 0.25rem 0rem;
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        /* ---- 検索フォーム ---- */
        .search-form {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .search-form .row {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            flex-wrap: wrap;
        }

        .search-form label {
            margin-left: 0.5rem;
            font-size: 0.8rem;
            min-width: 5rem;
        }

        .search-form input[type="text"] {
            flex: 1;
            min-width: 0;
        }

        .search-form input[type="datetime-local"] {
            flex: 1;
            min-width: 10rem;
        }

        #status {
            margin: 0.5rem 0.25rem;
            font-size: 0.85rem;
            min-height: 1.2em;
        }

        .event {
            word-break: break-all;
            padding: 0.4rem 0.25rem;
            border-top: 1px dashed var(--border);
        }

        .event.is-favored {
            border-right: 5px solid #ffeb3b;
        }

        .time,
        .author,
        .nostr-ref,
        .pubkey-ref {
            color: var(--link);
            text-decoration: none;
            font-weight: normal;
        }

        .post-content {
            display: inline;
            color: var(--txt);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: var(--border);
            border-radius: 20px;
            transition: 0.3s;
        }

        .slider:before {
            content: "";
            position: absolute;
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background: var(--panel);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            transition: 0.3s;
        }

        input:checked+.slider {
            background: var(--link);
        }

        input:checked+.slider:before {
            transform: translateX(20px);
            content: "";
        }

        .floating-btn-container {
            position: fixed;
            bottom: 4rem;
            right: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 100;
            opacity: 0.6;
            pointer-events: auto;
            transition: opacity 0.3s;
        }

        .floating-btn {
            height: 2.5rem;
            width: 2.5rem;
            background-color: var(--link);
            color: white;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-size: 1.5rem;
            font-weight: normal;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 0;
            transition: opacity 0.3s;
        }

        .floating-btn:hover {
            opacity: 1;
        }

        #settings-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        #settings-modal .settings-body {
            background: var(--panel);
            color: var(--txt);
            padding: 0.75rem 1.5rem 1.5rem 1.5rem;
            border-radius: 0.5rem;
            width: 90%;
            max-width: 400px;
        }

        #settings-modal .close-btn {
            padding: 0.5rem 1rem;
            background-color: var(--accent);
            color: #fff;
            display: inline;
        }

        #settings-modal a {
            color: var(--accent);
        }

        @media (max-width: 600px) {
            body {
                padding: 0.5rem;
            }

            .container {
                margin: 0;
                max-width: 100%;
            }

            .event {
                padding: 0.6rem 0.4rem;
                font-size: 0.9rem;
            }
        }

        .button-row {
            display: flex;
            gap: 0.5rem;
        }

        .event,
        .post-content,
        ul,
        li {
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="search-form">
            <div class="row">
                <label for="keyword">検索ワード</label>
                <input type="text" id="keyword" placeholder="例: おいしい">
            </div>
            <div class="row">
                <label for="since">いつから</label>
                <input type="datetime-local" id="since">
            </div>
            <div class="row">
                <label for="until">いつまで</label>
                <input type="datetime-local" id="until">
            </div>
            <div class="row">
                <label for="search-relay">検索先</label>
                <input type="text" id="search-relay" list="search-relay-suggestions"
                    placeholder="wss://search.nos.today" value="wss://search.nos.today">
                <datalist id="search-relay-suggestions">
                    <option value="wss://search.nos.today">
                    <option value="wss://r.kojira.io/">
                    <option value="wss://x.kojira.io/">
                </datalist>
            </div>
            <div class="row">
                <label for="normal-relay">ふぁぼりつ先</label>
                <input type="text" id="normal-relay" list="relay-suggestions" placeholder="wss://...">
                <datalist id="relay-suggestions">
                    <option value="wss://r.kojira.io/">
                    <option value="wss://yabu.me/">
                    <option value="wss://nostr.compile-error.net/">
                    <option value="wss://relay-jp.nostr.wirednet.jp/">
                    <option value="wss://relay.damus.io/">
                    <option value="wss://nos.lol/">
                    <option value="wss://x.kojira.io/">
                </datalist>
            </div>

            <div class="button-row">
                <button id="search-btn">検索</button>
                <button type="button" id="clear-btn" style="display: none;">クリア</button>
            </div>
        </div>

        <div id="status"></div>
        <ul id="timeline" style="list-style: none;"></ul>
        <div id="more-wrapper" style="display: none; margin: 16px 0; text-align: center;">
            <button type="button" id="load-more-btn">さらに古い投稿を読み込む</button>
        </div>
    </div>

    <div class="floating-btn-container">
        <button type="button" id="scroll-top-btn" class="floating-btn" style="display: none;">⏫</button>
        <button id="open-settings" class="floating-btn settings-btn">⚙️</button>
    </div>

    <div id="settings-modal" style="display: none;">
        <div class="settings-body">
            <div class="button-row" style="align-items: start; justify-content: space-between;">
                <span style="font-weight: bold; margin-top: 0.75rem;">settings</span>
                <button id="close-settings"
                    style="background-color: transparent; color: #ccc; font-size: 2rem; padding: 0;"
                    class="close-btn">×</button>
            </div>

            <div class="button-row" style="align-items: center; margin:0.25rem 0rem 0.25rem 0rem;">
                <span>ふぁぼ固定</span>
                <label class="switch">
                    <input type="checkbox" id="kind-7-fixed-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div id="kind-7-content-wrapper" class="button-row"
                style="align-items: center; margin:0.25rem 0rem 0.25rem 0rem;">
                <span>ふぁぼマーク </span>
                <input id="kind-7-content-input" type="text" maxlength="10" value="⭐"
                    style="width: 2.5rem; height: 1.5rem; text-align: center; font-size: 0.9rem; vertical-align: middle; border: 1px solid #ccc; border-radius: 4px; display: inline-block;">
            </div>

            <div class="button-row" style="align-items: center; margin:0.25rem 0rem 0.25rem 0rem;">
                <span>ダークモード</span>
                <div class="switch-container" style="display: inline;">
                    <label class="switch">
                        <input type="checkbox" id="theme-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="button-row" style="align-items: center; justify-content: space-between; margin-top: 0.25rem;">
                <span style="padding-top: 0.5rem;"><a
                        href="https://ompomz.github.io/flowgazer/kensaku.html">kensaku</a></span>
                <!-- okkake.html にはログイン導線が無いため、kensaku では設定内に🔑を置く -->
                <button id="open-auth"
                    style="background-color: var(--border); min-width: 4rem; min-height: 2rem;">🔑</button>
            </div>
        </div>
    </div>

    <script>
        // --- 設定モーダル／ダークモード（okkake.html と同じ挙動） ---
        document.getElementById('theme-toggle').onchange = function () {
            document.body.classList.toggle('dark-mode', this.checked);
            document.body.classList.toggle('light-mode', !this.checked);
            // 名前の色が isDark に依存するため再描画する
            window.kensaku?.render();
        };

        document.getElementById("open-settings").onclick = function () {
            document.getElementById("settings-modal").style.display = "flex";
        };
        document.getElementById("close-settings").onclick = function () {
            document.getElementById("settings-modal").style.display = "none";
        };
        document.getElementById("settings-modal").onclick = function (e) {
            if (e.target === this) this.style.display = "none";
        };
        document.getElementById("open-auth").onclick = function () {
            document.getElementById("settings-modal").style.display = "none";
            if (typeof showAuthUI === 'function') showAuthUI();
        };
    </script>

    <script src="https://unpkg.com/nostr-tools@2.17.0/lib/nostr.bundle.js"></script>
    <script src="./utility.js"></script>
    <script src="./event-bus.js"></script>
    <script src="./auth.js"></script>
    <script src="./auth-ui.js"></script>
    <script src="./relay-manager.js"></script>
    <script src="./cusemo.js"></script>
    <script src="./action-menu.js"></script>
    <script src="./kensaku.js"></script>
</body>

</html>
